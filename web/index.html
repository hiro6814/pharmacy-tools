<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pharmacy-tools｜薬剤師業務支援ツール</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

:root {
  --accent: #4f46e5; --accent-hover: #4338ca;
  --surface: #ffffff; --bg: #f4f6fb;
  --border: #e8ecf4; --text: #0f172a;
  --text-muted: #64748b; --text-faint: #94a3b8;
  --shadow-sm: 0 1px 3px rgba(15,23,42,.06);
  --shadow-md: 0 4px 16px rgba(15,23,42,.08);
  --shadow-lg: 0 12px 40px rgba(15,23,42,.12);
  --radius: 16px; --radius-sm: 10px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter','Hiragino Sans','Yu Gothic UI',sans-serif;
  background: var(--bg); color: var(--text);
  font-size: 14px; line-height: 1.6; min-height: 100vh;
}

header {
  background: #0c1445;
  background-image: radial-gradient(ellipse at 20% 50%,#1e3a8a44 0%,transparent 60%),
                    radial-gradient(ellipse at 80% 20%,#4f46e530 0%,transparent 50%);
  color: #fff; padding: 28px 24px 36px;
  text-align: center;
}
header h1 { font-size: 20px; font-weight: 700; color: #f8fafc; margin-bottom: 4px; }
header p { font-size: 12px; color: rgba(255,255,255,.5); }

.layout { max-width: 640px; margin: -18px auto 0; padding: 0 16px 40px; }

.freshness-chip {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 20px; padding: 5px 14px; font-size: 11px; color: var(--text-muted);
  box-shadow: var(--shadow-sm); margin-bottom: 16px;
}

/* ─── Primary app card (renal) ───────────────────── */
.app-primary {
  display: block; text-decoration: none; color: inherit;
  background: var(--surface); border-radius: var(--radius);
  border: 1px solid var(--border); box-shadow: var(--shadow-md);
  padding: 24px; margin-bottom: 20px;
  transition: transform .12s, box-shadow .12s;
}
.app-primary:active { transform: scale(.98); }
.app-primary-top { display: flex; align-items: center; gap: 14px; margin-bottom: 10px; }
.app-primary-icon {
  width: 48px; height: 48px; border-radius: 12px;
  background: linear-gradient(135deg,#1e3a5f,#2563eb);
  display: flex; align-items: center; justify-content: center;
  font-size: 24px; flex-shrink: 0; box-shadow: 0 4px 12px rgba(37,99,235,.3);
}
.app-primary-title { font-size: 17px; font-weight: 700; }
.app-primary-badge {
  font-size: 10px; font-weight: 600; color: var(--accent);
  background: #eef2ff; border-radius: 20px; padding: 2px 8px;
  display: inline-block; margin-top: 2px;
}
.app-primary-desc { font-size: 12.5px; color: var(--text-muted); line-height: 1.5; }

/* ─── Secondary app grid ─────────────────────────── */
.app-grid { display: grid; gap: 12px; }
.app-card {
  display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit;
  background: var(--surface); border-radius: var(--radius-sm);
  border: 1px solid var(--border); box-shadow: var(--shadow-sm);
  padding: 14px 16px; transition: transform .12s;
}
.app-card:active { transform: scale(.98); }
.app-card-icon {
  width: 38px; height: 38px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0; color: #fff;
}
.icon-crush { background: linear-gradient(135deg,#059669,#10b981); }
.icon-compat { background: linear-gradient(135deg,#ec4899,#f43f5e); }
.icon-subst { background: linear-gradient(135deg,#d97706,#f59e0b); }
.app-card-title { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
.app-card-desc { font-size: 11.5px; color: var(--text-muted); }
.app-card-arrow { margin-left: auto; color: var(--text-faint); font-size: 16px; flex-shrink: 0; }

.section-label {
  font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
  color: var(--text-faint); margin: 20px 0 10px 2px;
}

footer { text-align: center; font-size: 11px; color: var(--text-faint); margin-top: 28px; }
</style>
</head>
<body>

<header>
  <h1>💊 pharmacy-tools</h1>
  <p>薬剤師業務支援ツール一式</p>
</header>

<div class="layout">
  <div class="freshness-chip" id="topFreshnessChip">🔄 データ読込中...</div>

  <a class="app-primary" href="./renal/">
    <div class="app-primary-top">
      <div class="app-primary-icon">🧪</div>
      <div>
        <div class="app-primary-title">腎機能・用量調整計算</div>
        <span class="app-primary-badge">よく使う</span>
      </div>
    </div>
    <div class="app-primary-desc">CCr計算・腎機能に応じた投与量調整の目安を確認する</div>
  </a>

  <div class="section-label">その他のツール</div>
  <div class="app-grid">
    <a class="app-card" href="./crushing-checker/">
      <div class="app-card-icon icon-crush">💊</div>
      <div>
        <div class="app-card-title">粉砕・簡易懸濁法チェッカー</div>
        <div class="app-card-desc">経管投与・嚥下困難患者の薬剤投与方法を確認する</div>
      </div>
      <div class="app-card-arrow">›</div>
    </a>
    <a class="app-card" href="./compatibility-checker/">
      <div class="app-card-icon icon-compat">⚗️</div>
      <div>
        <div class="app-card-title">配合変化チェッカー</div>
        <div class="app-card-desc">ICU注射薬の配合可否・注意点を調べる</div>
      </div>
      <div class="app-card-arrow">›</div>
    </a>
    <a class="app-card" href="./substitution-checker/">
      <div class="app-card-icon icon-subst">🔄</div>
      <div>
        <div class="app-card-title">持参薬振替候補チェッカー</div>
        <div class="app-card-desc">持参薬から代替可能な院内採用薬を探す</div>
      </div>
      <div class="app-card-arrow">›</div>
    </a>
  </div>

  <footer>pharmacy-tools</footer>
</div>

<script src="./shared/drugs-master.js"></script>
<script>
(function(){
  try {
    var chip = document.getElementById('topFreshnessChip');
    if (typeof DRUG_MASTER_META !== 'undefined' && DRUG_MASTER_META.lastUpdated) {
      chip.textContent = '📅 収載薬剤マスタ最終更新: ' + DRUG_MASTER_META.lastUpdated + '（全体・個別薬剤の検証日は順次表示予定）';
    } else {
      chip.textContent = '📅 収載薬剤マスタ';
    }
  } catch (e) {
    var chip = document.getElementById('topFreshnessChip');
    if (chip) chip.textContent = '📅 収載薬剤マスタ';
  }
})();

// SW debug escape hatch: ?sw=unregister でService Workerを全解除
if (location.search.includes('sw=unregister') && 'serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(function(rs){
    rs.forEach(function(r){ r.unregister(); });
    caches.keys().then(function(keys){ keys.forEach(function(k){ caches.delete(k); }); });
    alert('Service Worker・キャッシュを全解除しました。ページを再読み込みしてください。');
  });
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('/service-worker.js').catch(function(){});
  });
}
</script>
</body>
</html>
