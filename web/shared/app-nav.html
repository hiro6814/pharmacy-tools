<!--
  web/shared/app-nav.html — 正典ナビゲーションスニペット（コピー元）

  ビルドステップがないため、各アプリのindex.htmlに手動でこのHTML片を
  貼り付けて使う。貼り付け箇所は必ず下記のマーカーコメントで囲むこと。
  4アプリ程度の規模なので自動同期ツールは作らず、nav変更時は4ファイルを
  開いて目視比較する運用とする。

  data-app の値でどのアプリのページかを判定し、自分自身へのリンクは
  「現在地」として背景反転で明示する（クリック不可）。挿入先のCSS変数
  命名は各アプリでやや異なるため、color/backgroundは直接指定している
  （継承に頼らない）。

  紺色ヘッダー3アプリ（crushing-checker/compatibility-checker/
  substitution-checker）用のマークアップ。renalは白背景の別レイアウトの
  ため、renal/index.html内に色違いの専用版を直接記述している。
-->
<!-- BEGIN SHARED-NAV v1 -->
<nav class="pharmacy-app-nav" aria-label="他のツールへ移動" style="display:flex;gap:8px;overflow-x:auto;flex-shrink:0;">
  <a href="/" data-app="top" class="pharmacy-nav-chip" style="white-space:nowrap;font-size:13px;font-weight:600;color:rgba(255,255,255,.92);background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.2);border-radius:20px;padding:8px 16px;text-decoration:none;transition:background .15s;">一覧</a>
  <a href="/renal/" data-app="renal" class="pharmacy-nav-chip" style="white-space:nowrap;font-size:13px;font-weight:600;color:rgba(255,255,255,.92);background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.2);border-radius:20px;padding:8px 16px;text-decoration:none;transition:background .15s;">🧪 腎機能</a>
  <a href="/crushing-checker/" data-app="crushing-checker" class="pharmacy-nav-chip" style="white-space:nowrap;font-size:13px;font-weight:600;color:rgba(255,255,255,.92);background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.2);border-radius:20px;padding:8px 16px;text-decoration:none;transition:background .15s;">💊 粉砕</a>
  <a href="/compatibility-checker/" data-app="compatibility-checker" class="pharmacy-nav-chip" style="white-space:nowrap;font-size:13px;font-weight:600;color:rgba(255,255,255,.92);background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.2);border-radius:20px;padding:8px 16px;text-decoration:none;transition:background .15s;">⚗️ 配合変化</a>
  <a href="/substitution-checker/" data-app="substitution-checker" class="pharmacy-nav-chip" style="white-space:nowrap;font-size:13px;font-weight:600;color:rgba(255,255,255,.92);background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.2);border-radius:20px;padding:8px 16px;text-decoration:none;transition:background .15s;">🔄 振替</a>
</nav>
<script>
(function () {
  var CURRENT_APP = 'crushing-checker'; // ← 各アプリで自身のdata-app値に書き換える
  var nav = document.currentScript.previousElementSibling;
  if (!nav || !nav.classList.contains('pharmacy-app-nav')) return;
  var links = nav.querySelectorAll('a[data-app]');
  links.forEach(function (a) {
    if (a.getAttribute('data-app') === CURRENT_APP) {
      a.style.background = '#ffffff';
      a.style.borderColor = '#ffffff';
      a.style.color = '#0c1445';
      a.style.pointerEvents = 'none';
      a.setAttribute('aria-current', 'page');
      a.removeAttribute('href');
    }
  });
})();
</script>
<!-- END SHARED-NAV v1 -->
